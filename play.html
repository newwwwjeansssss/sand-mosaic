<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sand Mosaic · H5</title><style>
:root{--bg:#0c1424;--panel:#121f34;--line:#243957;--text:#eaf2ff;--muted:#9eb2cc;--accent:#57d6b3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1b3452 0,#0c1424 45%);color:var(--text);font:14px system-ui,Segoe UI,sans-serif;min-height:100vh}.app{max-width:1180px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-size:24px;font-weight:800;letter-spacing:.5px}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;align-items:center}button{border:1px solid var(--line);background:#172944;color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#08241f;border-color:transparent}.layout{display:grid;grid-template-columns:220px 1fr 230px;gap:14px}.panel{background:rgba(18,31,52,.9);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px #0003}.levels{padding:12px}.levels h3,.info h3{margin:4px 4px 12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.level-list{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-height:600px;overflow:auto}.level-list button{padding:8px 4px;font-size:12px}.level-list button.active{background:#254d63;border-color:var(--accent)}.game{padding:14px;display:flex;flex-direction:column;align-items:center}.hud{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hud strong{font-size:18px}.meter{height:7px;background:#0b1422;border-radius:9px;overflow:hidden;width:150px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#58d6b3,#f6d365);width:100%}canvas{width:min(100%,680px);aspect-ratio:1;border-radius:14px;background:#0a1321;border:1px solid #2a405d;touch-action:none}.hint{color:var(--muted);font-size:12px;margin-top:10px}.info{padding:14px}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #22334d;color:var(--muted)}.stat b{color:var(--text)}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.dot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}.dot i{width:10px;height:10px;border-radius:50%;display:inline-block}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172944;border:1px solid var(--accent);padding:12px 18px;border-radius:12px;display:none}.modal{position:fixed;inset:0;background:#050b15aa;display:none;align-items:center;justify-content:center}.modal .box{background:#13243a;border:1px solid var(--accent);border-radius:18px;padding:26px;text-align:center;min-width:280px}.modal h2{margin:0 0 6px}.modal p{color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.levels{order:2}.info{order:3}.level-list{grid-template-columns:repeat(7,1fr);max-height:none}.game{order:1}}
select,input{width:100%;padding:9px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:#14243a;color:var(--text)}.info{overflow-wrap:anywhere}.level-list{max-height:540px}@media(max-width:900px){.level-list{max-height:260px}.top{gap:10px;flex-wrap:wrap}}</style></head><body><div class="app"><div class="top"><div><div class="brand">SAND <span>MOSAIC</span></div><div class="sub">Unity 全量关卡 · 原始配置保留</div></div><div class="actions"><button id="pause">暂停</button><button id="reset">↻ 重试</button><button id="next" class="primary">下一关 →</button></div></div><div class="layout"><aside class="panel levels"><h3>关卡选择 <span id="levelTotal"></span></h3><select id="mode" aria-label="关卡顺序"><option value="main">Unity 主线顺序</option><option value="loop">Unity 循环顺序</option><option value="raw">全部原始文件 ID</option></select><input id="search" aria-label="搜索关卡或 ID" placeholder="搜索关卡 / ID"><p class="sub">主线序号与文件 ID 不同</p><div id="levelList" class="level-list"></div></aside><main class="panel game"><div class="hud"><div><strong id="title">Level 1</strong><div class="sub" id="goal">拖动彩色盒子贴近沙画边缘</div></div><div style="text-align:right"><div class="sub">剩余盒子 <b id="remain">0</b></div><div class="meter"><i id="timebar"></i></div></div></div><canvas id="board" width="720" height="720"></canvas><div class="hint">拖动彩色盒子贴近沙画边缘，收集同色沙粒；盒子装满后消失。</div></main><aside class="panel info"><h3>关卡信息</h3><div class="stat"><span>原始文件 ID</span><b id="sourceId">—</b></div><p id="issues" role="status" style="color:#ffd35a;line-height:1.7"></p><p id="features" class="sub"></p><div class="stat"><span>网格</span><b id="grid">—</b></div><div class="stat"><span>盒子数</span><b id="pitCount">—</b></div><div class="stat"><span>沙仓数</span><b id="containerCount">—</b></div><div class="stat"><span>时间</span><b id="time">—</b></div><div class="legend" id="legend"></div></aside></div></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="box"><h2 id="resultTitle">完成！</h2><p id="resultText"></p><button id="again">再玩一次</button> <button id="continue" class="primary">下一关</button></div></div><script src="sand.js"></script><script src="container-view.js"></script><script src="board.js"></script><script src="app.js"></script></body></html>
